{% extends "base.html" %}
{% block content %}

<h3 class="mb-3">Register</h3>

<form method="post" class="card p-3" style="max-width: 520px;">
  <div class="mb-2">
    <label class="form-label">Full name</label>
    <input class="form-control" name="full_name" required>
  </div>

  <div class="mb-2">
    <label class="form-label">Email</label>
    <input class="form-control" name="email" type="email" required>
  </div>

  <div class="mb-2">
    <label class="form-label">Password</label>
    <input class="form-control" name="password" type="password" required>
  </div>

  <div class="mb-2">
    <label class="form-label">Role</label>
    <select class="form-select" name="role" id="role" required>
      <option value="player">Player</option>
      <option value="coach">Coach</option>
      <option value="admin">Admin</option>
    </select>
  </div>

  <!-- Emoji picker (shows only for Player) -->
  <div class="mb-2" id="emoji-box" style="display:none;">
    <label class="form-label">Profile Emoji</label>
    <select class="form-select" name="profile_emoji">
      <option value="">-- Random --</option>
      <option value="😀">😀</option>
      <option value="😎">😎</option>
      <option value="🤩">🤩</option>
      <option value="🧑‍🦱">🧑‍🦱</option>
      <option value="🧔">🧔</option>
    </select>
  </div>

  <button class="btn btn-success mt-2" type="submit">Create account</button>
</form>

<p class="mt-3"><a href="/login">Login</a></p>

<script>
  const roleSelect = document.getElementById('role');
  const emojiBox = document.getElementById('emoji-box');

  function toggleEmoji() {
    emojiBox.style.display = roleSelect.value === 'player' ? 'block' : 'none';
  }

  roleSelect.addEventListener('change', toggleEmoji);
  toggleEmoji();
</script>

{% endblock %}
