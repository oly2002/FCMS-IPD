{% extends "base.html" %}
{% block content %}

<!-- page title and back button -->
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="mb-0">Edit User</h3>
  <a class="btn btn-outline-secondary" href="/admin/users">Back to Users</a>
</div>

<!-- edit user form -->
<form method="post" class="card p-3" style="max-width: 600px;">
  <div class="mb-3 text-center">
    <!-- show user photo if available -->
    {% if user.profile_photo %}
      <img src="{{ url_for('static', filename='uploads/profiles/' ~ user.profile_photo) }}"
           alt="Profile Photo"
           width="90" height="90"
           class="rounded-circle border"
           style="object-fit: cover;">
    {% else %}
      <!-- default profile image -->
      <img src="{{ url_for('static', filename='img/default-profile.png') }}"
           alt="Default Profile"
           width="90" height="90"
           class="rounded-circle border"
           style="object-fit: cover;">
    {% endif %}
  </div>

  <div class="mb-2">
    <!-- user full name -->
    <label class="form-label">Full Name</label>
    <input class="form-control" name="full_name" value="{{ user.full_name }}" required>
  </div>

  <div class="mb-2">
    <!-- user email -->
    <label class="form-label">Email</label>
    <input class="form-control" name="email" type="email" value="{{ user.email }}" required>
  </div>

  <div class="mb-2">
    <!-- select user role -->
    <label class="form-label">Role</label>
    <select class="form-select" name="role" required>
      <option value="player" {% if user.role == "player" %}selected{% endif %}>Player</option>
      <option value="coach" {% if user.role == "coach" %}selected{% endif %}>Coach</option>
      <option value="admin" {% if user.role == "admin" %}selected{% endif %}>Admin</option>
    </select>
  </div>

  <!-- form buttons -->
  <div class="mt-3 d-flex gap-2">
    <button class="btn btn-success" type="submit">Save Changes</button>
    <a class="btn btn-secondary" href="/admin/users">Cancel</a>
  </div>
</form>

{% endblock %}
