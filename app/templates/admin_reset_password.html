{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="mb-0">Reset Password</h3>
  <a class="btn btn-outline-secondary" href="/admin/users">Back to Users</a>
</div>

<form method="post" class="card p-3" style="max-width: 600px;">
  <div class="mb-3 text-center">
    {% if user.profile_photo %}
      <img src="{{ url_for('static', filename='uploads/profiles/' ~ user.profile_photo) }}"
           alt="Profile Photo"
           width="90" height="90"
           class="rounded-circle border"
           style="object-fit: cover;">
    {% else %}
      <img src="{{ url_for('static', filename='img/default-profile.png') }}"
           alt="Default Profile"
           width="90" height="90"
           class="rounded-circle border"
           style="object-fit: cover;">
    {% endif %}
  </div>

  <div class="mb-2">
    <label class="form-label">User</label>
    <input class="form-control" value="{{ user.full_name }} ({{ user.email }})" disabled>
  </div>

  <div class="mb-2">
    <label class="form-label">New Password</label>
    <input class="form-control" type="password" name="password" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Confirm Password</label>
    <input class="form-control" type="password" name="confirm_password" required>
  </div>

  <div class="d-flex gap-2">
    <button class="btn btn-warning" type="submit">Reset Password</button>
    <a class="btn btn-secondary" href="/admin/users">Cancel</a>
  </div>
</form>

{% endblock %}
