{% extends "base.html" %}
{% block content %}

<h3 class="mb-3">Login</h3>

<form method="post" class="card p-3" style="max-width: 420px;" novalidate>

  <div class="mb-2">
    <label class="form-label">Email</label>
    <input
      class="form-control"
      name="email"
      type="email"
      required
      pattern="^[^@\s]+@[^@\s]+\.[^@\s]+$"
      title="Please enter a valid email address"
    >
  </div>

  <div class="mb-2">
    <label class="form-label">Password</label>
    <input
      class="form-control"
      name="password"
      type="password"
      required
    >
  </div>

  <button class="btn btn-primary mt-2" type="submit">Login</button>
</form>

<p class="mt-3">
  <a href="/register">Create an account</a>
</p>

{% endblock %}
