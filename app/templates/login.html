{% extends "base.html" %}
{% block content %}

<!-- page heading -->
<h3 class="mb-3">Login</h3>

<!-- login form -->
<form method="post" class="card p-3" style="max-width: 420px;" novalidate>

  <div class="mb-2">
    <!-- email input -->
    <label class="form-label">Email</label>
    <input
      class="form-control"
      name="email"
      type="email"
      required
      pattern="^[^@\s]+@[^@\s]+\.[^@\s]+$"
      title="Please enter a valid email address"
    >
  </div>

  <div class="mb-2">
    <!-- password input -->
    <label class="form-label">Password</label>
    <input
      class="form-control"
      name="password"
      type="password"
      required
    >
  </div>

  <!-- login button -->
  <button class="btn btn-primary mt-2" type="submit">Login</button>
</form>

<!-- link to register page -->
<p class="mt-3 mb-1">
  <a href="/register">Create an account</a>
</p>

<!-- forgot password link -->
<p class="mb-0">
  <a href="/forgot-password" class="small text-muted">Forgot password?</a>
</p>

{% endblock %}
