{% extends "base.html" %}
{% block content %}

<!-- page heading changes for create or edit -->
<h3 class="mb-3">
  {% if mode == "create" %}Create Session{% else %}Edit Session{% endif %}
</h3>

<!-- session form -->
<form method="post" class="card p-3">
  <div class="row g-3">
    <div class="col-md-6">
      <!-- session title -->
      <label class="form-label">Title</label>
      <input class="form-control" name="title" value="{{ session.title if session else 'Training Session' }}">
    </div>

    <div class="col-md-3">
      <!-- session date -->
      <label class="form-label">Date *</label>
      <input class="form-control" type="date" name="session_date"
             value="{{ session.session_date if session else '' }}" required>
    </div>

    <div class="col-md-3">
      <!-- session start time -->
      <label class="form-label">Start Time *</label>
      <input class="form-control" type="time" name="start_time"
             value="{{ session.start_time.strftime('%H:%M') if session and session.start_time else '' }}" required>
    </div>

    <div class="col-md-3">
      <!-- optional end time -->
      <label class="form-label">End Time</label>
      <input class="form-control" type="time" name="end_time"
             value="{{ session.end_time.strftime('%H:%M') if session and session.end_time else '' }}">
    </div>

    <div class="col-md-6">
      <!-- session location -->
      <label class="form-label">Location *</label>
      <input class="form-control" name="location" value="{{ session.location if session else '' }}" required>
    </div>

    <div class="col-md-3">
      <!-- max number of players -->
      <label class="form-label">Capacity *</label>
      <input class="form-control" type="number" min="1" name="capacity"
             value="{{ session.capacity if session else 20 }}" required>
    </div>

    <div class="col-md-6">
      <!-- assign coach if needed -->
      <label class="form-label">Assign Coach</label>
      <select class="form-select" name="coach_id">
        <option value="">-- None --</option>
        {% for c in coaches %}
          <option value="{{ c.id }}"
            {% if session and session.coach_id == c.id %}selected{% endif %}>
            {{ c.full_name }}
          </option>
        {% endfor %}
      </select>
    </div>
  </div>
  
  <div class="mt-3 d-flex gap-2">
    <button class="btn btn-success" type="submit">Save</button>
    <a class="btn btn-secondary" href="/admin/sessions">Cancel</a>
  </div>
</form>

{% endblock %}
